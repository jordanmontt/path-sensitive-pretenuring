# combining benchmark suites and executions
experiments:
    DataFrame:
        suites:
          - DataFrameExecution
        executions:
          - ExecutorBaselineDataFrame
          - ExecutorDataFramePSP90Sampling1_10
          - ExecutorDataFramePSP90Sampling1_100
          - ExecutorDataFramePSP90Sampling1_1000
          - ExecutorDataFramePSP80Sampling1_10
          - ExecutorDataFramePSP80Sampling1_100
          - ExecutorDataFramePSP80Sampling1_1000
          - ExecutorDataFramePSP70Sampling1_10
          - ExecutorDataFramePSP70Sampling1_100
          - ExecutorDataFramePSP70Sampling1_1000
          - ExecutorDataFrameTextualSampling1_10
          - ExecutorDataFrameTextualSampling1_100
          - ExecutorDataFrameTextualSampling1_1000
    Cormas:
        suites:
          - CormasExecution
        executions:
          - ExecutorBaselineCormas
          - ExecutorCormasPSP90Sampling1_10
          - ExecutorCormasPSP90Sampling1_100
          - ExecutorCormasPSP90Sampling1_1000
          - ExecutorCormasPSP80Sampling1_10
          - ExecutorCormasPSP80Sampling1_100
          - ExecutorCormasPSP80Sampling1_1000
          - ExecutorCormasPSP70Sampling1_10
          - ExecutorCormasPSP70Sampling1_100
          - ExecutorCormasPSP70Sampling1_1000
          - ExecutorCormasTextualSampling1_10
          - ExecutorCormasTextualSampling1_100
          - ExecutorCormasTextualSampling1_1000
