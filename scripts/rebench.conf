default_experiment: all
default_data_file: 'experiment.csv'

# a set of suites with different benchmarks and possibly different settings
benchmark_suites:
    DataFrameExecution:
        gauge_adapter: PlainSecondsLog
        command: |-
            eval "%(benchmark)s"
        input_sizes: [1]
        invocations: 30
        benchmarks:
            - "PSPRunner new benchmarkClass: VeritasDataFrame; run"
    CormasExecution:
        gauge_adapter: PlainSecondsLog
        command: |-
            eval "%(benchmark)s"
        input_sizes: [1]
        invocations: 30
        benchmarks:
            - "PSPRunner new benchmarkClass: VeritasCormas; run"

# a set of executables for the benchmark execution
executors:
    # DataFrame Textual
    ExecutorDataFrameTextualSampling1:
        path: "."
        executable: "reBenchRunner.sh"
        args: "./baseimage/pharo-vm/pharo --headless ./dataframe-textual-1/dataframe-textual-1.image --no-default-preferences"
    ExecutorDataFrameTextualSampling1_2:
        path: "."
        executable: "reBenchRunner.sh"
        args: "./baseimage/pharo-vm/pharo --headless ./dataframe-textual-1_2/dataframe-textual-1_2.image --no-default-preferences"
    ExecutorDataFrameTextualSampling1_10:
        path: "."
        executable: "reBenchRunner.sh"
        args: "./baseimage/pharo-vm/pharo --headless ./dataframe-textual-1_10/dataframe-textual-1_10.image --no-default-preferences"
    ExecutorDataFrameTextualSampling1_100:
        path: "."
        executable: "reBenchRunner.sh"
        args: "./baseimage/pharo-vm/pharo --headless ./dataframe-textual-1_100/dataframe-textual-1_100.image --no-default-preferences"
    ExecutorDataFrameTextualSampling1_1000:
        path: "."
        executable: "reBenchRunner.sh"
        args: "./baseimage/pharo-vm/pharo --headless ./dataframe-textual-1_1000/dataframe-textual-1_1000.image --no-default-preferences"

    # Cormas PSP90
    ExecutorCormasPSP90Sampling1:
        path: "."
        executable: "reBenchRunner.sh"
        args: "./baseimage/pharo-vm/pharo --headless ./cormas-psp90-1/cormas-psp90-1.image --no-default-preferences"
    ExecutorCormasPSP90Sampling1_2:
        path: "."
        executable: "reBenchRunner.sh"
        args: "./baseimage/pharo-vm/pharo --headless ./cormas-psp90-1_2/cormas-psp90-1_2.image --no-default-preferences"

    # Cormas PSP80
    ExecutorCormasPSP80Sampling1:
        path: "."
        executable: "reBenchRunner.sh"
        args: "./baseimage/pharo-vm/pharo --headless ./cormas-psp80-1/cormas-psp80-1.image --no-default-preferences"
    ExecutorCormasPSP80Sampling1_2:
        path: "."
        executable: "reBenchRunner.sh"
        args: "./baseimage/pharo-vm/pharo --headless ./cormas-psp80-1_2/cormas-psp80-1_2.image --no-default-preferences"

    # Cormas PSP70
    ExecutorCormasPSP70Sampling1:
        path: "."
        executable: "reBenchRunner.sh"
        args: "./baseimage/pharo-vm/pharo --headless ./cormas-psp70-1/cormas-psp70-1.image --no-default-preferences"
    ExecutorCormasPSP70Sampling1_2:
        path: "."
        executable: "reBenchRunner.sh"
        args: "./baseimage/pharo-vm/pharo --headless ./cormas-psp70-1_2/cormas-psp70-1_2.image --no-default-preferences"

    # Cormas Textual
    ExecutorCormasTextualSampling1:
        path: "."
        executable: "reBenchRunner.sh"
        args: "./baseimage/pharo-vm/pharo --headless ./cormas-textual-1/cormas-textual-1.image --no-default-preferences"
