        args: "./baseimage/pharo-vm/pharo --headless ./cormas-textual-1_1000/cormas-textual-1_1000.image --no-default-preferences"

# combining benchmark suites and executions
experiments:
    DataFrame:
        suites:
          - DataFrameExecution
        executions:
          - ExecutorDataFrameTextualSampling1
          - ExecutorDataFrameTextualSampling1_2
          - ExecutorDataFrameTextualSampling1_10
          - ExecutorDataFrameTextualSampling1_100
          - ExecutorDataFrameTextualSampling1_1000
    Cormas:
        suites:
          - CormasExecution
        executions:
          - ExecutorCormasPSP90Sampling1
          - ExecutorCormasPSP90Sampling1_2
          - ExecutorCormasPSP80Sampling1
          - ExecutorCormasPSP80Sampling1_2
          - ExecutorCormasPSP70Sampling1
          - ExecutorCormasPSP70Sampling1_2
          # Textual
          - ExecutorCormasTextualSampling1
          - ExecutorCormasTextualSampling1_2
          - ExecutorCormasTextualSampling1_10
          - ExecutorCormasTextualSampling1_100
          - ExecutorCormasTextualSampling1_1000
