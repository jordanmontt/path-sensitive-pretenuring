default_experiment: all
default_data_file: 'experiment.csv'

# a set of suites with different benchmarks and possibly different settings
benchmark_suites:
    DataFrameExecution:
        gauge_adapter: PlainSecondsLog
        command: |-
            eval "%(benchmark)s"
        input_sizes: [1]
        invocations: 30
        benchmarks:
            - "PSPRunner new benchmarkClass: VeritasDataFrame; run"
    CormasExecution:
        gauge_adapter: PlainSecondsLog
        command: |-
            eval "%(benchmark)s"
        input_sizes: [1]
        invocations: 30
        benchmarks:
            - "PSPRunner new benchmarkClass: VeritasCormas; run"

# a set of executables for the benchmark execution
executors:
    # Baseline
    ExecutorBaselineDataFrame:
        path: "."
        executable: "reBenchRunner.sh"
        args: "./baseimage/pharo-vm/pharo --headless ./dataframe/dataframe.image --no-default-preferences"
    ExecutorBaselineCormas:
        path: "."
        executable: "reBenchRunner.sh"
        args: "./baseimage/pharo-vm/pharo --headless ./cormas/cormas.image --no-default-preferences"

    # DataFrame PSP90
    ExecutorDataFramePSP90Sampling1_10:
        path: "."
        executable: "reBenchRunner.sh"
        args: "./baseimage/pharo-vm/pharo --headless ./dataframe-psp90-1_10/dataframe-psp90-1_10.image --no-default-preferences"
    ExecutorDataFramePSP90Sampling1_100:
